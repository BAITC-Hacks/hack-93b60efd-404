[project]
name = "hackalem-voice-router"
version = "0.1.0"
description = "HackAlem Case 2 Voice Router backend"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.11,<3",
    "pydantic>=2.11,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/voice_router"]
